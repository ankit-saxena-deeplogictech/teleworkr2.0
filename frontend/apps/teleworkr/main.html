<!--
A2 — the frozen shell. One header, built once, used by every screen. The five tabs
A1 fixes sit in it; everything else in the IA is reachable from the Me menu.
(C) 2026 TekMonks. All rights reserved.
-->
<!doctype html>
<html>
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link href="./img/favicon.svg" rel="icon" type="image/svg+xml">
	<meta name="apple-mobile-web-app-capable" content="yes"/>
	<meta name="mobile-web-app-capable" content="yes"/>

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

	<link rel="stylesheet" href="./css/tokens.css">
	<link rel="stylesheet" href="./css/shell.css">
	<link rel="stylesheet" href="./css/states.css">
	<link rel="stylesheet" href="./css/dayboard.css">
        <link rel="stylesheet" href="./css/training.css">
        <link rel="stylesheet" href="./css/surveys.css">
	import {main} from "./js/main.mjs"; monkshu_env.apps[APP_CONSTANTS.APP_NAME].main = main;
	import {shell} from "./js/shell.mjs"; monkshu_env.apps[APP_CONSTANTS.APP_NAME].shell = shell;
	shell.initShell();
	</script>
</head>

<body>
<div class="app">
	<header class="hdr">
		<div class="mark"><span class="wm">TeleWorkr</span><span class="by">by Tekmonks</span></div>

		<!-- the five tabs A1 fixes; drawn from the projection, never from a role name -->
		<nav class="tabs" id="tabs" aria-label="Sections"></nav>

		<!-- one search field, and it takes commands -->
		<div class="omni" id="omni" role="button" tabindex="0">
			<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
			<span>{{i18n.CommandBarHint}}</span><span class="kbd">⌘K</span>
		</div>

		<!-- the clock is persistent and states what it is bound to -->
		<div class="clock idle" id="clock">
			<span class="live"></span>
			<span class="val mono" id="clock-val">00:00:00</span>
			<span class="on-task" id="clock-task">not clocked in</span>
			<button class="act" id="clock-act">Clock in</button>
		</div>

		<!-- status is a control, not a readout -->
		<button class="statusctl" id="statusctl" data-status="offline">
			<span class="dot"></span><span id="status-label">Off the clock</span>
		</button>

		<!-- overlap chip: live count plus whether you are inside the shared window -->
		<button class="overlap" id="overlap" title="Team overlap"><span class="n">—</span> overlap</button>

		<div class="whenwhere">
			<span id="hdr-date"></span>
			<span class="l2" id="hdr-logged">—</span>
		</div>

		<button class="iconb" id="notifbtn" aria-label="Notifications">
			<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
		</button>

		<!-- Me: the consoles, the theme, and signing out -->
		<button class="av" id="avatar" aria-haspopup="true" aria-expanded="false"></button>
		<div class="memenu" id="memenu" role="menu"></div>
	</header>

	<!-- system banner slot: offline, degraded sync, session expiry -->
	<div class="banners" id="banners"></div>

	<!-- tab content region — every screen drops in here -->
	<div class="scroll"><div id="surface"></div></div>
</div>

<!-- toast region, bottom-left, one at a time -->
<div class="toasts"></div>
</body>
</html>
